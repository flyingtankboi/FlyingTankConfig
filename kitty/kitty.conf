# BEGIN_KITTY_FONTS

# FONTS AND COLORS
include theme.conf
font_size 10.0

# CURSOR
# cursor color in themes
cursor_trail 20
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 4
custom_shaders cursor-trail-motion-blur

# SCROLLBAR
scrollbar always

scrollbar_handle_opacity 0.2
scrollbar_radius 0.0

scrollbar_hitbox_expansion 0.40
scrollbar_gap 0.6
scrollbar_width 0.3

scrollbar_track_opacity 0.015
scrollbar_track_hover_opacity 0.01

# MOUSE
mouse_hide_wait -1

#url color in themes
url_style straight
show_hyperlink_targets shift

#copy-paste
strip_trailing_spaces smart

# END_KITTY_FONTS
