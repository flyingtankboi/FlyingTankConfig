# BEGIN_KITTY_FONTS

# FONTS AND COLORS
include theme.conf
font_size 10.0
palette_generate legacy

# CURSOR
# cursor color in themes
cursor_trail 20
cursor_trail_decay 0.1 0.2
cursor_trail_start_threshold 4
custom_shaders cursor-trail-motion-blur
cursor_shape underline
shell_integration no-cursor

# SCROLLBAR
scrollbar always

scrollbar_handle_opacity 0.2
scrollbar_radius 0.0

scrollbar_hitbox_expansion 0.40
scrollbar_gap 0.6
scrollbar_width 0.2

scrollbar_track_opacity 0.015
scrollbar_track_hover_opacity 0.01

# MOUSE
mouse_hide_wait -1

#url color in themes
url_style straight
show_hyperlink_targets shift

#copy-paste
strip_trailing_spaces smart

# WINDOWS
# colors in themes
draw_minimal_borders no
# TODO FIX THE PADDING
window_border_width 1pt
window_margin_width 0.8 1
single_window_margin_width 1.5 2

window_padding_width 2

placement_strategy center

# TAB BAR
tab_bar_margin_height 2.0 0.0
tab_bar_margin_width 0.0
tab_bar_style fade
tab_bar_align center

# END_KITTY_FONTS
