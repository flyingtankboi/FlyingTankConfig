# ──────────────────────────────────────────────────────────────
#  hyprlock.conf — HUD-style lock screen (Ember palette)
#
#  Location:  ~/.config/hypr/hyprlock.conf
#  Test it:   run `hyprlock` in kitty, unlock with your password.
#
#  Layout (centered): a "chrono" module framed by corner brackets,
#  wired into the authentication panel below it.
#
#        ┌─                         ─┐
#            ──── //SYS.CHRONO ────
#                 21:40 ⁰⁷           ← clock + live seconds (peach)
#          ›››  TUESDAY 21 OCTOBER  ‹‹‹
#              WK 43 // DAY 294
#        └─            ■            ─┘
#                      │               ← connector into the panel
#     ┌────────────────────────────┐
#     │ //SECURE/SESSION_LOCK    ■ │  ← cream title bar + red signal
#     │     //OPERATOR you         │
#     │  [ //ENTER PASSPHRASE   ]  │
#     │  › AWAITING AUTHENTICATION │
#     └────────────────────────────┘
#
#  Palette:
#    base #1A161C   text #FFF0E2   subtle #DDD1C4   muted #88756A
#    peach #FEAF72  peach_hi #FFCBA3  peach_dk #BE8355
#    urgent #D00003 error #E5483E
#
#  Stacking (zindex, higher = drawn on top):
#    -1 panel frame · 0 default · 1 title bar, connector node, panel
#    content · 2 title text, red signal block
#
#  Positions are pixels from the screen center (positive y = up).
#  Inside text, "##" is a literal "#" (a single # starts a comment).
# ──────────────────────────────────────────────────────────────

$FONT = JetBrainsMono Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

# ── Background: your image, blurred and darkened ──────────────
background {
    monitor =
    path = /home/flyingtankboi/Pictures/Wallpaper/Orange_SciFi_Eclipse-recolored.jpg
    color = rgb(1A161C)          # fallback if the image can't be loaded

    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# ══════════════════════════════════════════════════════════════
#  CHRONO MODULE — corner brackets (each corner = 2 thin bars)
#  Frame corners at x = ±190, top y = 265, bottom y = 88
# ══════════════════════════════════════════════════════════════

# top-left
shape {
    monitor =
    size = 22, 2
    color = rgb(FEAF72)
    rounding = 0
    border_size = 0
    position = -179, 264
    halign = center
    valign = center
}
shape {
    monitor =
    size = 2, 22
    color = rgb(FEAF72)
    rounding = 0
    border_size = 0
    position = -189, 254
    halign = center
    valign = center
}

# top-right
shape {
    monitor =
    size = 22, 2
    color = rgb(FEAF72)
    rounding = 0
    border_size = 0
    position = 179, 264
    halign = center
    valign = center
}
shape {
    monitor =
    size = 2, 22
    color = rgb(FEAF72)
    rounding = 0
    border_size = 0
    position = 189, 254
    halign = center
    valign = center
}

# bottom-left
shape {
    monitor =
    size = 22, 2
    color = rgb(FEAF72)
    rounding = 0
    border_size = 0
    position = -179, 89
    halign = center
    valign = center
}
shape {
    monitor =
    size = 2, 22
    color = rgb(FEAF72)
    rounding = 0
    border_size = 0
    position = -189, 99
    halign = center
    valign = center
}

# bottom-right
shape {
    monitor =
    size = 22, 2
    color = rgb(FEAF72)
    rounding = 0
    border_size = 0
    position = 179, 89
    halign = center
    valign = center
}
shape {
    monitor =
    size = 2, 22
    color = rgb(FEAF72)
    rounding = 0
    border_size = 0
    position = 189, 99
    halign = center
    valign = center
}

# Connector: a node on the module's bottom edge, wired down into the panel
shape {
    monitor =
    size = 2, 28
    color = rgb(FEAF72)
    rounding = 0
    border_size = 0
    position = 0, 74
    halign = center
    valign = center
    zindex = 0
}
shape {
    monitor =
    size = 8, 8
    color = rgb(FEAF72)
    rounding = 0
    border_size = 0
    position = 0, 88
    halign = center
    valign = center
    zindex = 1
}

# ── Chrono labels ─────────────────────────────────────────────
# Module header with hairlines
label {
    monitor =
    text = ──────  <b>//SYS.</b>CHRONO  ──────
    color = rgb(88756A)
    font_size = 9
    font_family = $FONT
    position = 0, 242
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(FFF0E2)
    font_size = 76
    font_family = $FONT
    position = 0, 190
    halign = center
    valign = center
}

# Live seconds, tucked at the clock's lower right
label {
    monitor =
    text = cmd[update:1000] date +"%S"
    color = rgb(FEAF72)
    font_size = 18
    font_family = $FONT
    position = 165, 160
    halign = center
    valign = center
}

# Date between peach chevrons, uppercased, in English (LC_TIME=C)
label {
    monitor =
    text = cmd[update:60000] echo "<span foreground='##FEAF72'>›››</span>  $(LC_TIME=C date +'%A %d %B' | sed 's/.*/\U&/')  <span foreground='##FEAF72'>‹‹‹</span>"
    color = rgb(DDD1C4)
    font_size = 12
    font_family = $FONT
    position = 0, 128
    halign = center
    valign = center
}

# Technical readout: ISO week + day of the year
label {
    monitor =
    text = cmd[update:60000] date +"WK %V // DAY %j"
    color = rgb(88756A)
    font_size = 9
    font_family = $FONT
    position = 0, 106
    halign = center
    valign = center
}

# ══════════════════════════════════════════════════════════════
#  AUTH PANEL
#  Frame 440 × 200 centered at 0, -40 (top edge at y = 60)
# ══════════════════════════════════════════════════════════════

shape {
    monitor =
    size = 440, 200
    color = rgba(1A161CE6)
    rounding = 0
    border_size = 2
    border_color = rgb(FEAF72)
    position = 0, -40
    halign = center
    valign = center
    zindex = 0
}

# Title bar
shape {
    monitor =
    size = 440, 28
    color = rgb(FFF0E2)
    rounding = 0
    border_size = 0
    position = 0, 46
    halign = center
    valign = center
    zindex = 2
}

# Red signal block at the right end of the title bar
shape {
    monitor =
    size = 12, 12
    color = rgb(D00003)
    rounding = 0
    border_size = 0
    position = 204, 46
    halign = center
    valign = center
    zindex = 3
}

# Small peach notches on the panel's side edges
shape {
    monitor =
    size = 8, 2
    color = rgb(FEAF72)
    rounding = 0
    border_size = 0
    position = -225, -40
    halign = center
    valign = center
}
shape {
    monitor =
    size = 8, 2
    color = rgb(FEAF72)
    rounding = 0
    border_size = 0
    position = 225, -40
    halign = center
    valign = center
}

# Title bar text (above the title bar)
label {
    monitor =
    text = <b>//SECURE</b>/SESSION_LOCK
    color = rgb(1A161C)
    font_size = 11
    font_family = $FONT
    position = -110, 46
    halign = center
    valign = center
    zindex = 3
}

# Who is logged in
label {
    monitor =
    text = <b>OPERATOR <span foreground='##FEAF72'>▶</span></b> <span weight="200">$USER</span>
    color = rgb(DDD1C4)
    font_size = 12
    font_family = $FONT
    position = 0, 8
    halign = center
    valign = center
    zindex = 2
}

# Status line
label {
    monitor =
    text = <span foreground='##FEAF72'>›</span> AWAITING AUTHENTICATION <span foreground='##FEAF72'>‹</span>
    color = rgb(88756A)
    font_size = 10
    font_family = $FONT
    position = 0, -100
    halign = center
    valign = center
    zindex = 2
}

# ── Password field ────────────────────────────────────────────
input-field {
    monitor =
    size = 380, 44
    rounding = 0
    outline_thickness = 2

    outer_color = rgb(FEAF72)
    inner_color = rgb(1A161C)
    font_color = rgb(FFF0E2)
    font_family = $FONT

    check_color = rgb(FFCBA3)    # brighter peach while checking
    fail_color = rgb(D00003)     # sharp red outline on a wrong password
    capslock_color = rgb(BE8355) # dark peach when Caps Lock is on

    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = 0

    fade_on_empty = false
    placeholder_text = <span foreground="##88756A"> //ENTER PASSPHRASE</span>
    fail_text = <span foreground="##E5483E">//ACCESS DENIED [$ATTEMPTS]</span>

    position = 0, -40
    halign = center
    valign = center
    zindex = 2
}
